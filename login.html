<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login or create your account">
  <title>Login | Money Minds</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="page-wrapper">
  <header class="header">
    <div class="header-inner container">
      <a href="index.html" class="logo"><img src="assets/money-minds-logo.png" alt="Money Minds logo" class="logo-image"><span class="logo-text-block"><span class="logo-name">MoneyMinds</span><span class="logo-tagline">Smart Students. Smarter Money.</span></span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="schedule.html">Schedule</a>
        <a href="dashboard.html">Dashboard</a>
        <div class="nav-dropdown">
          <a href="resources.html" class="nav-dropdown-trigger">Resources</a>
          <div class="nav-dropdown-menu" id="resources-dropdown-menu"></div>
        </div>
        <a href="stock-game.html">Stock Game</a>
        <a href="alumni-network.html">Alumni Network</a>
        <a href="login.html" class="active">Login</a>
      </nav>
      <button class="mobile-menu-btn" aria-label="Menu" style="display: none;">☰</button>
    </div>
  </header>

  <main>
    <section class="container auth-wrap">
      <div class="auth-card card">
        <h1 class="section-title">Login or Create Account</h1>
        <p class="section-subtitle">Use email/password or continue with Google.</p>

        <div class="auth-tabs">
          <button id="tab-login" class="btn btn-secondary auth-tab active" type="button">Login</button>
          <button id="tab-signup" class="btn btn-secondary auth-tab" type="button">Sign Up</button>
        </div>

        <form id="auth-form" class="auth-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="student@example.com">

          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="8" placeholder="At least 8 characters">

          <button id="submit-btn" class="btn btn-primary" type="submit">Login</button>
        </form>

        <div class="auth-divider">or</div>
        <a id="google-login-btn" class="btn btn-secondary" href="#" style="width: 100%;">Continue with Google</a>

        <p id="auth-message" class="auth-message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
